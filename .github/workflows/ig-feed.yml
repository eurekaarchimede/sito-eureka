# Aggiorna Instagram dopo ogni controllo circolari (ogni 5 minuti, 08:00–22:55).
# La cadenza è sincronizzata col feed scuola: trigger esterno ogni 5 minuti,
# con il cron GitHub del feed scuola come rete di sicurezza best-effort.
# Token rinnovato con margine; i file vengono committati solo se i dati cambiano.
# Esecuzione manuale: tab Actions → "aggiorna feed instagram" → Run workflow.
name: aggiorna feed instagram

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ig-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: scarica post e rinnova token
        run: node scripts/fetch-ig.mjs
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: prepara immagini leggere per mobile
        run: |
          python -m pip install Pillow==12.2.0
          python scripts/optimize-images.py
          python scripts/check-site.py

      - name: committa se c'è qualcosa di nuovo
        run: |
          git config user.name "ig-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ig assets/optimized data/token.enc
          if git diff --cached --quiet; then
            echo "nessuna novità"
          else
            git commit -m "feed instagram aggiornato"
            git pull --rebase origin main
            git push
          fi
