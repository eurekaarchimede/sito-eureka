# Aggiorna il feed Instagram ogni 30 minuti (ai minuti :10 e :40),
# includendo gli orari richiesti 15:10, 16:10, 20:10, 20:40 e 21:10,
# rinnova il token Meta e committa assets/ig/feed.json + immagini.
# Esecuzione manuale: tab Actions → "aggiorna feed instagram" → Run workflow.
name: aggiorna feed instagram

on:
  workflow_dispatch: {}
  schedule:
    - cron: '10,40 * * * *'
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: ig-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: scarica post e rinnova token
        run: node scripts/fetch-ig.mjs
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: prepara immagini leggere per mobile
        run: |
          python -m pip install Pillow==12.2.0
          python scripts/optimize-images.py
          python scripts/check-site.py

      - name: committa se c'è qualcosa di nuovo
        run: |
          git config user.name "ig-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ig assets/optimized data/token.enc
          if git diff --cached --quiet; then
            echo "nessuna novità"
          else
            git commit -m "feed instagram aggiornato"
            git pull --rebase origin main
            git push
          fi
