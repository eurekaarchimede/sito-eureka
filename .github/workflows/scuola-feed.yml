name: aggiorna circolari e orari

on:
  workflow_dispatch:
    inputs:
      test_push:
        description: "Invia una push di prova al dispositivo indicato o al segmento Test Users"
        type: boolean
        default: false
      test_subscription_id:
        description: "Subscription ID del dispositivo da provare (opzionale, usato solo con test_push)"
        type: string
        default: ""
  schedule:
    # Backup del trigger esterno: controlli dalle 08:00 alle 22:55, ora italiana.
    # Il scheduler GitHub può subire ritardi; non garantisce un limite di cinque minuti.
    - cron: '*/5 8-22 * * *'
      timezone: "Europe/Rome"

permissions:
  contents: write
  actions: write

concurrency:
  group: scuola-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: rispetta la fascia oraria anche per il cron esterno
        id: window
        env:
          TEST_PUSH: ${{ inputs.test_push }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          active = 8 <= datetime.now(ZoneInfo('Europe/Rome')).hour < 23
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"active={str(active).lower()}\n")
          print('fascia 08:00–22:55 attiva' if active else 'pausa notturna: nessuna richiesta alla scuola')
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true' && inputs.test_push != true
        with:
          python-version: '3.12'
      - name: leggi il sito della scuola
        id: school_feed
        if: steps.window.outputs.active == 'true' && inputs.test_push != true
        run: |
          if python3 scripts/fetch-scuola.py; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fonte scolastica temporaneamente non raggiungibile::Nessun dato è stato sostituito e gli invii sono saltati. Il prossimo controllo riproverà automaticamente."
          fi
      - name: salva i nuovi avvisi
        if: steps.window.outputs.active == 'true' && inputs.test_push != true && steps.school_feed.outputs.available == 'true'
        run: |
          git config user.name "scuola-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scuola/feed.json assets/scuola/version.json
          if git diff --cached --quiet; then
            echo "nessuna novità"
          else
            git commit -m "aggiorna circolari e orari"
            git pull --rebase origin main
            git push
          fi
      - name: notifica le nuove circolari
        id: push_notification
        if: (steps.window.outputs.active == 'true' && steps.school_feed.outputs.available == 'true') || inputs.test_push == true
        continue-on-error: true
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          TEST_SUBSCRIPTION: ${{ inputs.test_subscription_id }}
        run: |
          if [ "$TEST_PUSH" = "true" ]; then
            if [ -n "$TEST_SUBSCRIPTION" ]; then
              python3 scripts/send-circolari-notification.py --test --test-subscription "$TEST_SUBSCRIPTION"
            else
              python3 scripts/send-circolari-notification.py --test
            fi
          else
            python3 scripts/send-circolari-notification.py
          fi
      - name: invia le nuove circolari via email
        if: steps.window.outputs.active == 'true' && inputs.test_push != true && steps.school_feed.outputs.available == 'true'
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 scripts/send-circolari-email.py
      - name: salva i registri delle notifiche
        if: always() && steps.window.outputs.active == 'true' && inputs.test_push != true && steps.school_feed.outputs.available == 'true'
        run: |
          git config user.name "scuola-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in assets/scuola/notifiche-inviate.json assets/scuola/email-inviate.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "registri notifiche invariati"
          else
            git commit -m "registra invii circolari"
            git pull --rebase origin main
            git push
          fi
      - name: avvia il controllo Instagram
        if: always() && steps.window.outputs.active == 'true' && inputs.test_push != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 15 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ig-feed.yml/dispatches"
      - name: segnala gli invii push falliti
        if: always() && steps.push_notification.outcome == 'failure'
        run: |
          echo "::error::Invio push fallito. Il registro conserva le circolari pendenti: controllare lo step notifiche prima di ritentare."
          exit 1
