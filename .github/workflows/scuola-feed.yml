name: aggiorna circolari e orari

on:
  workflow_dispatch: {}
  schedule:
    # Scansioni ogni 5 minuti, spostate fuori dai minuti tondi per ridurre
    # ritardi e salti del scheduler GitHub nei momenti più congestionati.
    - cron: '2-57/5 8-21 * * *'
      timezone: "Europe/Rome"
    # Ultimo controllo alle 22:55; non interroga tra le 23:00 e le 08:00.
    - cron: '5,10,15,20,25,30,35,40,45,50,55 22 * * *'
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: scuola-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: leggi il sito della scuola
        run: python3 scripts/fetch-scuola.py
      - name: salva i nuovi avvisi
        run: |
          git config user.name "scuola-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scuola/feed.json
          if git diff --cached --quiet; then
            echo "nessuna novità"
          else
            git commit -m "aggiorna circolari e orari"
            git pull --rebase origin main
            git push
          fi
      - name: notifica le nuove circolari
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 scripts/send-circolari-notification.py
      - name: salva il registro notifiche
        run: |
          git config user.name "scuola-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scuola/notifiche-inviate.json
          if git diff --cached --quiet; then
            echo "registro notifiche invariato"
          else
            git commit -m "registra notifiche circolari"
            git pull --rebase origin main
            git push
          fi
