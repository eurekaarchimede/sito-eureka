<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0a1632">
  <title>pagina non trovata — eureka!</title>
  <meta name="description" content="Questa pagina non esiste. Torna al sito di eureka! o consulta le circolari del Liceo Archimede.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/notifications/icon-eureka-v2-180.png">
  <link rel="preload" href="/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "DM Sans";
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url("/fonts/dmsans-latin.woff2") format("woff2");
    }
    :root {
      color-scheme: dark;
      --bg: #0a1632;
      --bg-soft: #112045;
      --cream: #f7eed5;
      --beige: #ede0b8;
      --gold: #f5cd47;
      --line: rgba(237, 224, 184, .2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 64px);
      background: radial-gradient(ellipse at top, var(--bg-soft), var(--bg) 72%);
      color: var(--beige);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.6;
    }
    main { width: min(100%, 640px); text-align: center; }
    .logo { display: block; width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 20px; }
    .label { margin: 0 0 12px; color: var(--gold); font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; color: var(--cream); font-size: clamp(34px, 7vw, 56px); line-height: 1.1; letter-spacing: -.045em; }
    .description { max-width: 480px; margin: 20px auto 28px; font-size: clamp(16px, 2vw, 19px); }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .actions a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; color: var(--cream); font-weight: 700; text-decoration: none; }
    .actions .primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
    .actions a:hover { border-color: var(--gold); }
    .actions a:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
    @media (max-width: 420px) { .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/notifications/icon-eureka-v2-192.png" width="192" height="192" alt="eureka!">
    <p class="label">errore 404</p>
    <h1>questa pagina non c'è.</h1>
    <p class="description">il link potrebbe essere incompleto o non essere più valido. ritrova i progetti, le persone e le circolari di eureka! dal sito.</p>
    <nav class="actions" aria-label="continua la navigazione">
      <a class="primary" href="/">torna all'inizio</a>
      <a href="/#scuola">vai alle circolari</a>
    </nav>
  </main>
</body>
</html>
